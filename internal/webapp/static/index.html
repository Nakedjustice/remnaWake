<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 12px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--secondary-bg);
    color: var(--text);
  }
  #header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; margin: 8px 4px 16px; }
  #lang { width: auto; margin: 0; padding: 6px 8px; font-size: 13px; flex-shrink: 0; border-radius: 10px; }
  .card {
    background: var(--bg);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 15px; }
  .row .k { color: var(--hint); flex-shrink: 0; }
  .row .v { text-align: right; word-break: break-word; }
  .badge { font-weight: 600; }
  .sub-link {
    display: block;
    font-size: 13px;
    color: var(--link);
    word-break: break-all;
    margin: 6px 0 2px;
    text-decoration: none;
  }
  button {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    background: var(--button);
    color: var(--button-text);
    cursor: pointer;
  }
  button.secondary {
    background: var(--secondary-bg);
    color: var(--text);
  }
  button:disabled { opacity: .55; }
  .tariffs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tariffs button {
    flex: 1 1 calc(50% - 4px);
    width: auto;
    margin-top: 0;
    padding: 10px 6px;
  }
  .tariffs button.selected { outline: 3px solid var(--link); }
  .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .btn-grid button { flex: 1 1 calc(50% - 4px); width: auto; margin-top: 0; padding: 14px 6px; }
  .section-title { font-size: 16px; margin: 16px 4px 8px; }
  .hint { color: var(--hint); font-size: 13px; margin-top: 8px; }
  pre.requisites {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 14px;
    background: var(--secondary-bg);
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0 0;
  }
  .chat { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px 2px; }
  .bubble { max-width: 82%; padding: 8px 11px; border-radius: 14px; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
  .bubble.from-user { align-self: flex-end; background: var(--link); color: #fff; }
  .bubble.from-admin { align-self: flex-start; background: var(--secondary-bg); color: var(--text); }
  .bubble .meta { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
  .conv { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .conv .badge { background: var(--link); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  #status { text-align: center; color: var(--hint); padding: 32px 8px; font-size: 15px; }
  input, textarea, select {
    width: 100%;
    border: 1px solid var(--secondary-bg);
    border-radius: 10px;
    padding: 10px;
    margin-top: 8px;
    font-size: 15px;
    font-family: inherit;
    background: var(--secondary-bg);
    color: var(--text);
  }
  textarea { min-height: 90px; resize: vertical; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--secondary-bg);
    padding: 8px 0;
    font-size: 14px;
  }
  .item:first-of-type { border-top: 0; }
  .item .info { word-break: break-word; }
  .item .st { color: var(--hint); font-size: 13px; }
  .item button { width: auto; margin: 0; padding: 7px 12px; font-size: 13px; flex-shrink: 0; }
  .item .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .utable { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .utable th, .utable td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--secondary-bg); font-size: 14px; }
  .utable th { color: var(--hint); font-weight: 600; }
  .utable tbody tr { cursor: pointer; }
  .pair { display: flex; gap: 8px; }
  .gift { border-top: 1px solid var(--secondary-bg); padding: 8px 0; font-size: 14px; }
  .gift:first-of-type { border-top: 0; }
  .gift .code { font-family: ui-monospace, monospace; }
  .gift .st { color: var(--hint); font-size: 13px; }
  .gift-buyer { border-top: 1px solid var(--secondary-bg); padding: 4px 0; }
  .gift-buyer > summary { cursor: pointer; padding: 8px 0; font-weight: 500; }
  details { border-top: 1px solid var(--secondary-bg); }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; padding: 8px 0; font-size: 15px; font-weight: 600; }
</style>
</head>

function resolveLang(serverLang) {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === 'ru' || saved === 'en') return saved;
  const tgLang = ((tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || '').toLowerCase();
  if (tgLang.startsWith('ru')) return 'ru';
  if (tgLang.startsWith('en')) return 'en';
  if (serverLang === 'ru' || serverLang === 'en') return serverLang;
  return 'ru';
}

let LANG = resolveLang(null);

// t translates the Russian source string into the current language and
// substitutes {placeholders} with params. split/join avoids the special
// handling of `$` that String.replaceAll would apply to replacements.
function t(key, params) {
  let s = (LANG === 'en' && EN[key] !== undefined) ? EN[key] : key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
}

function applyStaticText() {
  document.documentElement.lang = LANG;
  document.title = t('Личный кабинет');
  titleEl.textContent = t('👤 Личный кабинет');
}

// currentRender re-runs the active view after a language switch.
let currentRender = showCabinet;
langSel.value = LANG;
langSel.onchange = () => {
  LANG = langSel.value === 'en' ? 'en' : 'ru';
  localStorage.setItem(LANG_KEY, LANG);
  applyStaticText();
  currentRender();
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function row(parent, k, v) {
  const r = el('div', 'row');
  r.appendChild(el('span', 'k', k));
  r.appendChild(el('span', 'v', v));
  parent.appendChild(r);
  return r;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Authorization': 'tma ' + tg.initData,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || t('Ошибка {n}', { n: res.status }));
  return body;
}

function daysWord(n) {
  if (LANG === 'en') return n === 1 ? 'day' : 'days';
  const last = n % 100;
  if (last >= 11 && last <= 14) return 'дней';
  switch (n % 10) {
    case 1: return 'день';
    case 2: case 3: case 4: return 'дня';
    default: return 'дней';
  }
}

// statusLabel and giftStatusLabel mirror the server's subStatusLabel /
// giftStatusLabel so the labels follow the selected language rather than
// BOT_LANG. The server still sends *_label fields (in BOT_LANG); we build
// them from the raw status here instead.
function statusLabel(status) {
  switch (status) {
    case 'ACTIVE': return t('✅ Активна');
    case 'EXPIRED': return t('⛔ Истекла');
    case 'DISABLED': return t('🚫 Отключена');
    case 'LIMITED': return t('⚠️ Превышен лимит трафика');
  }
  return status || '—';
}

function giftStatusLabel(g) {
  switch (g.status) {
    case 'pending': return t('⏳ Ожидает подтверждения оплаты');
    case 'issued': return t('📨 Выдан, ожидает активации');
    case 'redeemed': return t('✅ Активирован') + (g.redeemed_username ? ` (${g.redeemed_username})` : '');
    case 'rejected': return t('❌ Отклонён');
    case 'revoked': return t('🚫 Отозван');
  }
  return g.status;
}

function renderProfile(p, data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '📡 ' + p.username));
  const st = row(card, t('Статус'), statusLabel(p.status));
  st.querySelector('.v').classList.add('badge');
  if (p.expire_at) {
    let v = p.expire_at;
    if (p.days_left > 0) v += ` (${t('осталось {n} {word}', { n: p.days_left, word: daysWord(p.days_left) })})`;
    row(card, t('Действует до'), v);
  }
  if (p.uuid) row(card, t('UUID'), p.uuid);
  row(card, t('Лимит устройств'), p.hwid_limit > 0 ? String(p.hwid_limit) : '∞');
  row(card, t('Использовано трафика'), (p.used_traffic_gb || '0') + ' GB');
  row(card, t('Лимит трафика'), p.traffic_limit_gb > 0 ? p.traffic_limit_gb + ' GB' : '∞');
  if (p.subscription_url) {
    const a = el('a', 'sub-link', p.subscription_url);
    a.href = p.subscription_url;
    a.target = '_blank';
    card.appendChild(a);
    const copy = el('button', 'secondary', t('📋 Скопировать ссылку'));
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(p.subscription_url);
        copy.textContent = t('✅ Скопировано');
        setTimeout(() => copy.textContent = t('📋 Скопировать ссылку'), 1500);
      } catch { tg.showAlert(t('Не удалось скопировать, выделите ссылку вручную.')); }
    };
    card.appendChild(copy);
  }
  card.appendChild(renderRenew(p, data));
  return card;
}

function renderRenew(p, data) {
  const wrap = el('div');
  let months = 0;
  const tariffs = data.tariffs || [];
  if (tariffs.length) {
    wrap.appendChild(el('div', 'hint', t('Продление — выберите период:')));
    const grid = el('div', 'tariffs');
    tariffs.forEach(tf => {
      const b = el('button', 'secondary', t('{months} мес. — {price}', { months: tf.months, price: tf.price_label }));
      b.onclick = () => {
        months = tf.months;
        grid.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        pay.disabled = false;
      };
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
  } else {
    months = 1;
  }
  const pay = el('button', null, t('💳 Оплатить / продлить'));
  pay.disabled = tariffs.length > 0;
  // choiceBox holds the payment-method buttons when several providers are enabled.
  const choiceBox = el('div', 'tariffs');
  choiceBox.hidden = true;
  const resetPay = () => { pay.disabled = false; pay.textContent = t('💳 Оплатить / продлить'); };
  const doRenew = async (provider) => {
    choiceBox.hidden = true;
    choiceBox.innerHTML = '';
    pay.disabled = true;
    pay.textContent = t('Отправка…');
    try {
      const body = { remnawave_id: p.remnawave_id, months };
      if (provider) body.provider = provider;
      const res = await api('/api/renew', { method: 'POST', body: JSON.stringify(body) });
      if (res.status === 'choose_provider') {
        resetPay();
        (res.providers || []).forEach(id => {
          const b = el('button', 'secondary', providerLabel(id));
          b.onclick = () => doRenew(id);
          choiceBox.appendChild(b);
        });
        choiceBox.hidden = false;
      } else if (res.status === 'awaiting_screenshot') {
        pay.textContent = t('📸 Ждём чек в чате с ботом');
        tg.showAlert(t('Осталось прикрепить чек: перейдите в чат с ботом и отправьте фото, скриншот или PDF-файл чека об оплате — после этого заявка уйдёт администратору.'));
      } else if (res.status === 'platega' && res.payment_url) {
        pay.textContent = t('💳 Открываем оплату…');
        tg.openLink(res.payment_url);
        tg.showAlert(t('Откроется страница оплаты. После оплаты подписка продлится автоматически.'));
        resetPay();
      } else if (res.status === 'telegram_stars' && res.invoice_url) {
        pay.textContent = t('⭐ Открываем оплату…');
        tg.openInvoice(res.invoice_url, (st) => {
          if (st === 'paid') {
            pay.textContent = t('✅ Оплачено');
            tg.showAlert(t('Оплата прошла! Подписка продлена.'));
          } else {
            resetPay();
          }
        });
      } else {
        pay.textContent = t('✅ Заявка отправлена');
        tg.showAlert(t('Заявка отправлена администратору. После оплаты и подтверждения подписка будет продлена.'));
      }
    } catch (e) {
      resetPay();
      tg.showAlert(e.message);
    }
  };
  pay.onclick = () => doRenew('');
  wrap.appendChild(pay);
  wrap.appendChild(choiceBox);
  return wrap;
}

// providerLabel mirrors the bot's providerButtonLabel for the mini-app chooser.

  switch (id) {
    case 'platega': return t('💳 Картой / СБП');

    default: return t('💳 Перевод (P2P)');

      ? t('{months} мес. — {price}', { months: tf.months, price: tf.price_label })

      grid.querySelectorAll('button').forEach(x => x.classList.remove('selected'));

    } catch (e) {

      send.textContent = t('🎁 Отправить заявку');

// renderInvite mirrors the chat /invite flow: enter a username, the request
// goes to the admins for approval.
function renderInvite() {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, t('👥 Пригласить пользователя')));
  card.appendChild(el('div', 'hint',
    t('Имя нового пользователя: буквы, цифры и «_», от 3 до 32 символов. Заявку рассмотрит администратор.')));
  const input = Object.assign(el('input'), { placeholder: t('Имя пользователя') });
  card.appendChild(input);
  const send = el('button', null, t('👥 Отправить заявку'));
  send.onclick = async () => {
    const name = input.value.trim();
    if (!/^[\p{L}\p{N}_]{3,32}$/u.test(name)) {
      tg.showAlert(t('Некорректное имя: только буквы, цифры и «_», от 3 до 32 символов.'));
      return;
    }
    if (!(await confirmDialog(t('Отправить заявку на пользователя «{name}»?', { name })))) return;
    send.disabled = true;
    send.textContent = t('Отправка…');
    try {
      await api('/api/invite', { method: 'POST', body: JSON.stringify({ username: name }) });
      tg.showAlert(t('Заявка отправлена администратору.'));
      input.value = '';
      await showCabinet();
      return;
    } catch (e) { tg.showAlert(e.message); }
    send.disabled = false;
    send.textContent = t('👥 Отправить заявку');
  };
  card.appendChild(send);
  return card;
}

// renderMyGifts groups the user's gifts by status, like the bot's /mygifts

// menuCard builds one hub section: a title, a hint and one or more buttons that

  const card = el('div', 'card');

  buttons.forEach(([label, onClick]) => {

  return card;
}

// showHome renders the "My account" hub: an Administration section (admins
// only), a My subscription section and an Invitation section.
function showHome() {
  currentRender = showHome;
  stopSupportPoll();
  const data = cabinetData || {};
  appEl.textContent = '';

  if (data.is_admin) {
    appEl.appendChild(menuCard(
      t('⚙️ Администрирование'),
      t('Тарифы, реквизиты, подарочные коды и заявки на оплату.'),
      [[t('⚙️ Открыть админ-панель'), showAdmin]]));
  }

  if (!data.linked) {
    appEl.appendChild(renderUnlinked());
    if (data.trial_available) appEl.appendChild(renderTrialClaim());
  } else {
    appEl.appendChild(menuCard(
      t('📡 Моя подписка'),
      t('UUID, срок действия, лимит устройств и трафик.'),
      [[t('📡 Открыть подписку'), showSubscription]]));
    appEl.appendChild(menuCard(
      t('🎟 Приглашения'),
      t('Подарите подписку или пригласите пользователя.'),
      [
        [t('🎁 Подарить'), showGift],
        [t('👥 Пригласить'), showInvite],
        [t('📦 Мои подарки'), showMyGifts],
        [t('👥 Мои приглашения'), showMyInvites],
      ]));
  }

  appEl.appendChild(menuCard(
    t('💬 Поддержка'),

function confirmDialog(message) {
  return new Promise(resolve => {
    if (tg.showConfirm) tg.showConfirm(message, ok => resolve(ok));
    else resolve(window.confirm(message));
  });
}

// showCabinet (re)loads /api/me and renders the hub. It is the canonical

  showHome();

// adminData caches the latest /api/admin payload so the admin hub and its

// ---- Support chat (user + admin) ----

// supportTimer holds the active polling interval so it can be cleared on any
// navigation. Every top-level view that is not a support view calls
// stopSupportPoll(); support views restart it via startSupportPoll().
let supportTimer = null;

function stopSupportPoll() {
  if (supportTimer) { clearInterval(supportTimer); supportTimer = null; }
}

function startSupportPoll(fn, ms) {
  stopSupportPoll();
  supportTimer = setInterval(() => { fn().catch(() => {}); }, ms);
}

// renderChatMessages fills a container with styled message bubbles, newest at
// the bottom, and scrolls to the latest.
function renderChatMessages(box, messages) {
  box.textContent = '';
  if (!messages || !messages.length) {
    box.appendChild(el('div', 'hint', t('Чат пуст. Напишите сообщение администратору.')));
    return;
  }
  messages.forEach(m => {
    const b = el('div', 'bubble ' + (m.from_admin ? 'from-admin' : 'from-user'));
    b.appendChild(el('span', null, m.text));
    b.appendChild(el('span', 'meta', (m.from_admin ? t('Поддержка') : t('Вы')) + ' · ' + (m.created_at || '')));
    box.appendChild(b);
  });
  box.scrollTop = box.scrollHeight;
}

// showSupport is the user's own support thread with a send box and a close
// (delete) button, polling for admin replies while open.
async function showSupport() {
  currentRender = showSupport;
  stopSupportPoll();
  appEl.textContent = '';
  appEl.appendChild(subPageTop(t('💬 Чат с поддержкой')));

  const chatCard = el('div', 'card');
  const box = el('div', 'chat');
  chatCard.appendChild(box);
  const text = Object.assign(el('textarea'), { placeholder: t('Введите сообщение…') });
  chatCard.appendChild(text);
  const send = el('button', null, t('Отправить'));
  send.onclick = async () => {
    const v = text.value.trim();
    if (!v) { tg.showAlert(t('Сообщение не может быть пустым.')); return; }
    send.disabled = true;
    try {
      await api('/api/support/send', { method: 'POST', body: JSON.stringify({ text: v }) });
      text.value = '';
      await refreshSupport(box);
    } catch (e) { tg.showAlert(e.message); }
    send.disabled = false;
  };
  chatCard.appendChild(send);
  const close = el('button', 'secondary', t('Завершить чат'));
  close.onclick = async () => {
    if (!(await confirmDialog(t('Завершить чат с поддержкой? История будет удалена.')))) return;
    try {
      await api('/api/support/close', { method: 'POST', body: '{}' });
      showHome();
    } catch (e) { tg.showAlert(e.message); }
  };
  chatCard.appendChild(close);
  appEl.appendChild(chatCard);

  statusEl.hidden = true;
  appEl.hidden = false;
  await refreshSupport(box);
  startSupportPoll(() => refreshSupport(box), 4000);
}

async function refreshSupport(box) {
  const data = await api('/api/support');
  renderChatMessages(box, data.messages);
}

async function refreshAdminSupportList(list) {
  const data = await api('/api/admin/support');
  const convs = data.conversations || [];
  list.textContent = '';
  if (!convs.length) {
    list.appendChild(el('div', 'hint', t('Нет открытых обращений.')));
    return;
  }
  convs.forEach(c => {
    const btn = el('button', 'secondary');
    btn.style.flex = '1 1 100%';
    const wrap = el('div', 'conv');
    const left = el('div');
    left.appendChild(el('div', null, c.username || t('Без имени')));
    if (c.last_text) left.appendChild(el('div', 'hint', c.last_text));
    wrap.appendChild(left);
    if (c.unread) wrap.appendChild(el('span', 'badge', String(c.unread)));
    btn.appendChild(wrap);
    btn.onclick = () => showAdminSupportThread(c.user_id, c.username);
    list.appendChild(btn);
  });

// adminAction posts a mutation (optionally after a confirm dialog), refreshes
// the cached panel data and re-renders the current admin view in place.
async function adminAction(path, payload, message) {
  if (message && !(await confirmDialog(message))) return;
  try {
    await api(path, { method: 'POST', body: JSON.stringify(payload) });
    adminData = await api('/api/admin');
    currentRender();
  } catch (e) { tg.showAlert(e.message); }
}

// cabinetAction is the user-side mirror of adminAction: post a mutation, refresh
// the cached /api/me payload and re-render the current cabinet view in place.
async function cabinetAction(path, payload) {
  try {
    await api(path, { method: 'POST', body: JSON.stringify(payload) });
    cabinetData = await api('/api/me');
    currentRender();
  } catch (e) { tg.showAlert(e.message); }
}

    data.tariffs.forEach(tf => {

      const del = el('button', 'secondary', t('🗑 Удалить'));
      del.onclick = () => adminAction('/api/admin/tariff/delete', { months: tf.months },
        t('Удалить тариф на {months} мес.?', { months: tf.months }));

    });

    card.appendChild(el('div', 'hint', t('Тарифы не заданы.')));

function renderAdminPaymentProvider(data) {
  const available = data.available_providers || [];
  // Only meaningful when an automatic provider exists beyond the default P2P.
  if (!available.some(p => p !== 'p2p')) return null;
  const enabled = data.enabled_providers || [];
  const card = el('div', 'card');
  card.appendChild(el('h2', null, t('💳 Способы оплаты')));
  card.appendChild(el('div', 'hint',
    t('Включите один или несколько способов. Если включено больше одного — пользователь выбирает при оплате.')));
  available.forEach(id => {
    const on = enabled.includes(id);
    const btn = el('button', on ? null : 'secondary', (on ? '✅ ' : '⬜ ') + providerAdminLabel(id));
    btn.onclick = () => adminAction('/api/admin/payment-provider', { provider: id, enabled: !on });
    card.appendChild(btn);
  });
  return card;
}

// providerAdminLabel mirrors the bot's providerAdminLabel.
function providerAdminLabel(id) {
  switch (id) {
    case 'platega': return t('Platega (СБП/карта)');
    case 'telegram_stars': return t('Telegram Stars');
    default: return t('P2P (вручную)');
  }
}

function renderAdminGifts(data) {

    const notUsed = b.not_used || [];

    const summary = el('summary', null,
      t('{buyer} — 🆕 {n} / ✅ {m}', { buyer: b.buyer, n: notUsed.length, m: used.length }));
    box.appendChild(summary);

    if (notUsed.length) {
      box.appendChild(el('div', 'hint', t('🆕 Не использованы')));
      notUsed.forEach(g => {

          t('Отозвать код {code}?', { code: g.code }));
        item.appendChild(revoke);
        box.appendChild(item);
      });
    }

    if (used.length) {
      box.appendChild(el('div', 'hint', t('✅ Использованы')));

        const item = el('div', 'item');
        const info = el('div', 'info');

    const btns = el('div', 'btns');

      t('Создать пользователя «{username}» по заявке от «{inviter}»?', { username: r.new_username, inviter: r.inviter }));
    const rej = el('button', 'secondary', '❌');
    rej.onclick = () => adminAction('/api/admin/invite-request/reject', { id: r.id },
      t('Отклонить заявку на пользователя «{username}»?', { username: r.new_username }));
    btns.appendChild(ok);
    btns.appendChild(rej);
    item.appendChild(btns);
    card.appendChild(item);
  });
  return card;
}

function renderAdminSquad(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, t('🛡 Сквад по умолчанию')));
  card.appendChild(el('div', 'hint', data.default_squad_name
    ? t('Новые пользователи добавляются в сквад «{name}».', { name: data.default_squad_name })
    : t('Сквад не выбран: используется сквад «Default-Squad», если он есть в панели.')));
  const select = el('select');
  select.appendChild(Object.assign(el('option', null, t('Загрузка…')), { value: '' }));
  select.disabled = true;
  card.appendChild(select);
  const save = el('button', null, t('💾 Сохранить сквад'));
  save.disabled = true;
  save.onclick = () => {
    if (!select.value) { tg.showAlert(t('Выберите сквад.')); return; }
    adminAction('/api/admin/squad', { uuid: select.value });
  };
  card.appendChild(save);
  api('/api/admin/squads').then(res => {
    select.textContent = '';
    const squads = res.squads || [];
    if (!squads.length) {
      select.appendChild(Object.assign(el('option', null, t('В панели нет сквадов')), { value: '' }));
      return;
    }
    squads.forEach(sq => {
      const opt = Object.assign(el('option', null, sq.name), { value: sq.uuid });
      if (sq.selected) opt.selected = true;
      select.appendChild(opt);
    });
    if (!squads.some(sq => sq.selected)) {
      select.insertBefore(Object.assign(el('option', null, t('— не выбран —')),
        { value: '', selected: true }), select.firstChild);
    }
    select.disabled = false;
    save.disabled = false;
  }).catch(e => {
    select.textContent = '';
    select.appendChild(Object.assign(el('option', null, t('Ошибка загрузки сквадов')), { value: '' }));
    tg.showAlert(e.message);
  });
  return card;
}

// showUserAdmin is a dedicated page: the full user list with a live username
// search; tapping a row opens that user's editable card.
async function showUserAdmin() {
  let users;
  try {
    users = (await api('/api/admin/users')).users || [];
  } catch (e) { tg.showAlert(e.message); return; }
  currentRender = showUserAdmin;

  appEl.textContent = '';
  const top = el('div', 'card');
  top.appendChild(el('h2', null, t('👤 Управление пользователями')));
  const back = el('button', 'secondary', t('← Назад'));
  back.onclick = renderAdminHome;
  top.appendChild(back);
  appEl.appendChild(top);

  const card = el('div', 'card');
  const search = Object.assign(el('input'), { placeholder: t('Поиск по имени…') });
  card.appendChild(search);

  const table = el('table', 'utable');
  const thead = el('thead');
  const htr = el('tr');
  [t('Имя'), t('Статус'), t('Подписка до')].forEach(h => htr.appendChild(el('th', null, h)));
  thead.appendChild(htr);
  table.appendChild(thead);
  const tbody = el('tbody');
  table.appendChild(tbody);
  card.appendChild(table);
  appEl.appendChild(card);

  const renderRows = () => {
    const q = search.value.trim().toLowerCase();
    const matched = q ? users.filter(u => (u.username || '').toLowerCase().includes(q)) : users;
    tbody.textContent = '';
    if (!matched.length) {
      const tr = el('tr');
      const td = el('td', null, t('Пользователи не найдены.'));
      td.colSpan = 3;
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    matched.forEach(u => {
      const tr = el('tr');
      tr.appendChild(el('td', null, u.username));
      tr.appendChild(el('td', null, u.status));
      tr.appendChild(el('td', null, u.expire_at));
      tr.onclick = () => openUser(u.username);
      tbody.appendChild(tr);
    });
  };
  search.oninput = renderRows;
  renderRows();

  statusEl.hidden = true;
  appEl.hidden = false;
}

// openUser swaps the page to one user's editable card with a back-to-list link.
async function openUser(username) {
  let user;
  try {
    user = (await api('/api/admin/user/find', { method: 'POST', body: JSON.stringify({ query: username }) })).user;
  } catch (e) { tg.showAlert(e.message); return; }
  currentRender = () => openUser(username);
  appEl.textContent = '';
  const top = el('div', 'card');
  top.appendChild(el('h2', null, t('👤 Управление пользователем')));
  const back = el('button', 'secondary', t('← К списку'));
  back.onclick = showUserAdmin;
  top.appendChild(back);
  appEl.appendChild(top);

  const card = el('div', 'card');
  renderUserCard(card, user);
  appEl.appendChild(card);

  statusEl.hidden = true;
  appEl.hidden = false;
}

// renderUserCard fills container with the editable card for one user. update()
// posts a single-field patch then re-fetches the card so it always reflects
// the panel.
function renderUserCard(container, user) {
  container.textContent = '';
  const update = async (payload) => {
    try {
      await api('/api/admin/user/update', { method: 'POST', body: JSON.stringify({ uuid: user.uuid, username: user.username, ...payload }) });
      const res = await api('/api/admin/user/find', { method: 'POST', body: JSON.stringify({ query: user.username }) });
      renderUserCard(container, res.user);
    } catch (e) { tg.showAlert(e.message); }
  };

  const info = el('div', 'item');
  info.appendChild(el('div', 'info', t('Имя: ') + user.username));
  info.appendChild(el('div', 'info', t('Статус: ') + user.status));
  info.appendChild(el('div', 'info', t('Подписка до: ') + user.expire_at));
  container.appendChild(info);

  // Expiry +/- days.
  const exp = el('div', 'item');
  [['+30д', 30], ['+90д', 90], ['−30д', -30]].forEach(([label, days]) => {
    const b = el('button', 'secondary', t(label));
    b.onclick = () => update({ expire_days: days });
    exp.appendChild(b);
  });
  // A text input (not type=number) so negative days work even on Telegram's
  // numeric soft keyboards, which often omit the minus key.
  const expInput = Object.assign(el('input'), { type: 'text', inputMode: 'numeric', placeholder: t('± дней (напр. -15)') });
  exp.appendChild(expInput);
  const expSet = el('button', null, t('Применить дни'));
  expSet.onclick = () => {
    const n = parseInt(expInput.value.trim(), 10);
    if (isNaN(n)) { tg.showAlert(t('Введите число дней (можно отрицательное).')); return; }
    update({ expire_days: n });
  };
  exp.appendChild(expSet);
  container.appendChild(exp);

  // HWID limit.
  container.appendChild(numberField(t('📱 Лимит устройств (0 — без ограничения)'), user.hwid_limit, v => update({ hwid_limit: v })));
  // Traffic limit GB.
  container.appendChild(numberField(t('📊 Лимит трафика, GB (0 — без ограничения)'), user.traffic_limit_gb, v => update({ traffic_gb: v })));

  // Reset strategy.
  const rs = el('div', 'item');
  rs.appendChild(el('div', 'info', t('🔄 Стратегия сброса')));
  const rsSel = el('select');
  ['NO_RESET', 'DAY', 'WEEK', 'MONTH'].forEach(s => {
    const opt = Object.assign(el('option', null, s), { value: s });
    if (s === user.reset_strategy) opt.selected = true;
    rsSel.appendChild(opt);
  });
  rs.appendChild(rsSel);
  const rsSave = el('button', null, t('💾 Сохранить'));
  rsSave.onclick = () => update({ reset_strategy: rsSel.value });
  rs.appendChild(rsSave);
  container.appendChild(rs);

  // Status toggle.
  const st = el('div', 'item');
  const active = user.status === 'ACTIVE';
  const stBtn = el('button', active ? 'secondary' : null, active ? t('⛔ Отключить подписку') : t('✅ Включить подписку'));
  stBtn.onclick = () => update({ status: active ? 'DISABLED' : 'ACTIVE' });
  st.appendChild(stBtn);
  container.appendChild(st);

  // Squad checkboxes.
  const sq = el('div', 'item');
  sq.appendChild(el('div', 'info', t('🛡 Сквады')));
  (user.squads || []).forEach(s => {
    const btn = el('button', s.selected ? null : 'secondary', (s.selected ? '✅ ' : '⬜ ') + s.name);
    btn.onclick = () => {
      const next = (user.squads || []).filter(x => x.selected).map(x => x.uuid);
      const i = next.indexOf(s.uuid);
      if (i >= 0) next.splice(i, 1); else next.push(s.uuid);
      update({ squad_uuids: next });
    };
    sq.appendChild(btn);
  });
  container.appendChild(sq);
}

// numberField builds a labelled numeric input with a save button.
function numberField(label, value, onSave) {
  const item = el('div', 'item');
  item.appendChild(el('div', 'info', label));
  const input = Object.assign(el('input'), { type: 'number', value: value });
  item.appendChild(input);
  const save = el('button', null, t('💾 Сохранить'));
  save.onclick = () => {
    const n = parseInt(input.value, 10);
    if (isNaN(n) || n < 0) { tg.showAlert(t('Введите целое число ≥ 0.')); return; }
    onSave(n);
  };
  item.appendChild(save);
  return item;
}

    [

      [t('🎁 Активные подарочные коды'), showAdminGiftCodes],

// in-place mutations re-render correctly.

  } catch (e) { tg.showAlert(e.message); return; }

  const statsCard = (title, rows) => {
    const card = el('div', 'card');
    card.appendChild(el('h2', null, title));
    rows.forEach(([label, value]) => row(card, label, String(value)));
    return card;

  appEl.textContent = '';
  appEl.appendChild(adminSubTop());
  appEl.appendChild(statsCard(t('Пользователи панели'), [
    [t('Всего'), stats.users_total],
    [t('Активные'), stats.users_active],
    [t('Истекают в ближайшие 7 дней'), stats.users_expiring_soon],
    [t('Истекшие'), stats.users_expired],
    [t('С привязанным Telegram'), stats.users_linked],

  appEl.appendChild(statsCard(t('Оплаты за 30 дней'), [
    [t('Подтверждено'), stats.payments_confirmed_30d],
    [t('Выручка'), stats.revenue_label],
    [t('Ожидают подтверждения'), stats.payments_pending],
  ]));
  appEl.appendChild(statsCard(t('Подарочные коды'), [
    [t('Ожидают оплаты'), stats.gifts_pending],
    [t('Выданы'), stats.gifts_issued],
    [t('Активированы'), stats.gifts_activated],
  ]));
  appEl.appendChild(statsCard(t('👥 Приглашения'), [
    [t('Ожидают одобрения'), stats.invites_pending],
  ]));
  statusEl.hidden = true;
  appEl.hidden = false;
}

(async () => {
  applyStaticText();
  statusEl.textContent = t('Загрузка…');
  if (!tg.initData) {
    statusEl.textContent = t('Откройте это приложение из Telegram.');
    return;
  }
  try {
    const data = await api('/api/me');
    // With no saved choice and no Telegram-language match, fall back to the
    // bot's configured language (BOT_LANG) exposed in the payload.
    if (!localStorage.getItem(LANG_KEY)) {
      LANG = resolveLang(data.lang);
      langSel.value = LANG;
      applyStaticText();
    }
    cabinetData = data;
    showHome();
  } catch (e) {
    statusEl.textContent = '⚠️ ' + e.message;
  }
})();
