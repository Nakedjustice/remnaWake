// infraDraft holds the server currently being edited (null = the add form is blank).
let infraDraft = null;

function infraInput(props) { return Object.assign(el('input'), props); }

// toISODate converts a "DD.MM.YYYY" label to the "YYYY-MM-DD" an <input type=date> wants.
function toISODate(s) {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s || '');
  return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
}
function round2(x) { return Math.round((Number(x) || 0) * 100) / 100; }

// Infrastructure monitoring: list of rented servers (tap to expand details),
// an add/edit form, and the FX card. Server-sent labels (price_label,
// period_cost_label, monthly_base_label, ram_label) stay in BOT_LANG like other
// server-rendered labels.
async function showAdminServers() {
  currentRender = showAdminServers;
  showLoadingView('admin', t('Инфраструктура'), title => adminPageTop(title));
  let servers, fx;
  try {
    [servers, fx] = await Promise.all([api('/api/admin/servers'), api('/api/admin/fx')]);
  } catch (e) { tg.showAlert(e.message); return; }
  servers = servers || [];

  appEl.textContent = '';
  appEl.appendChild(adminPageTop(t('Инфраструктура')));

  let totalBase = 0;
  servers.forEach((s) => { if (s.converted) totalBase += s.monthly_base; });
  const totalLabel = '≈ ' + Math.round(totalBase) + (fx.base_symbol || '') + t('/мес');
  appEl.appendChild(paymentStatsCard(t('Инфраструктура'), [
    [t('Серверов'), servers.length],
    [t('Расходы в месяц'), totalLabel],
  ]));

  if (servers.length) {
    const card = el('div', 'admin-card');
    card.appendChild(el('h2', null, t('🖥 Серверы')));
    servers.forEach((srv) => card.appendChild(renderInfraServer(srv)));
    appEl.appendChild(card);
  } else {
    appEl.appendChild(el('div', 'admin-card admin-empty', t('Серверы не добавлены.')));
  }

  appEl.appendChild(renderInfraForm());
  appEl.appendChild(renderInfraFx(fx));

  statusEl.hidden = true;
  appEl.hidden = false;
}

function renderInfraServer(srv) {
  const box = el('details', 'gift-buyer');
  const title = `${srv.name}${srv.country ? ' · ' + srv.country : ''} — ${srv.price_label}`;
  box.appendChild(el('summary', null, title));

  const detail = el('div');
  detail.style.cssText = 'padding:6px 0';
  [
    [t('Хостер'), srv.hoster || '—'],
    [t('CPU'), srv.cpu_cores ? String(srv.cpu_cores) : '—'],
    [t('RAM'), srv.ram_label],
    [t('Стоимость'), srv.period_cost_label],
    [t('Оценка в мес.'), srv.monthly_base_label],
    [t('Следующая оплата'), srv.next_due || t('не задана')],
  ].forEach(([k, v]) => {
    const row = el('div');
    row.style.cssText = 'display:flex;justify-content:space-between;gap:12px;padding:3px 0';
    const key = el('span', null, k); key.style.color = 'var(--hint)';
    row.appendChild(key);
    row.appendChild(el('span', null, String(v)));
    detail.appendChild(row);
  });
  box.appendChild(detail);

  const actions = el('div');
  actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:6px';
  const paid = el('button', 'secondary', t('✅ Оплачен'));
  paid.onclick = () => infraPost('/api/admin/server/paid', { id: srv.id });
  const edit = el('button', 'secondary', t('✏️ Изменить'));
  edit.onclick = () => { infraDraft = srv; showAdminServers(); window.scrollTo(0, document.body.scrollHeight); };
  const del = el('button', 'secondary', t('🗑 Удалить'));
  del.onclick = async () => {
    if (!(await confirmDialog(t('Удалить сервер «{name}»?', { name: srv.name })))) return;
    infraPost('/api/admin/server/delete', { id: srv.id });
  };
  actions.appendChild(paid);
  actions.appendChild(edit);
  actions.appendChild(del);
  box.appendChild(actions);
  return box;
}

// infraPost mutates server/FX state then re-renders the infra screen in place.
async function infraPost(path, payload) {
  const button = activeButton();
  setButtonLoading(button, true, t('Сохранение…'));
  try {
    await api(path, { method: 'POST', body: JSON.stringify(payload) });
    showAdminServers();
  } catch (e) {
    setButtonLoading(button, false);
    tg.showAlert(e.message);
  }
}

function renderInfraForm() {
  const d = infraDraft || {};
  const card = el('div', 'admin-card');
  card.appendChild(el('h2', null, d.id ? t('✏️ Редактирование сервера') : t('➕ Новый сервер')));

  const grid = el('div', 'admin-form-grid');
  const name = infraInput({ placeholder: t('Название'), value: d.name || '' });
  const hoster = infraInput({ placeholder: t('Хостер'), value: d.hoster || '' });
  const country = infraInput({ placeholder: t('Страна'), value: d.country || '' });
  const cpu = infraInput({ type: 'number', min: '0', placeholder: t('CPU, ядра'), value: d.cpu_cores || '' });
  const ram = infraInput({ type: 'number', min: '0', placeholder: t('RAM, МБ'), value: d.ram_mb || '' });
  const price = infraInput({ type: 'number', min: '0', placeholder: t('Цена'), value: d.price != null ? d.price : '' });
  const currency = el('select');
  ['USD', 'EUR', 'RUB', 'KZT', 'UAH', 'GBP', 'TRY', 'PLN', 'INR'].forEach((c) => {
    const o = el('option', null, c);
    o.value = c;
    if ((d.currency || 'USD') === c) o.selected = true;
    currency.appendChild(o);
  });
  const period = infraInput({ type: 'number', min: '1', placeholder: t('Период, мес.'), value: d.period_months || 1 });
  const due = infraInput({ type: 'date', value: toISODate(d.next_due) });
  [name, hoster, country, cpu, ram, price, currency, period, due].forEach((x) => grid.appendChild(x));
  card.appendChild(grid);

  const save = el('button', null, t('💾 Сохранить сервер'));
  save.onclick = async () => {
    const payload = {
      id: d.id || 0,
      name: name.value.trim(),
      hoster: hoster.value.trim(),
      country: country.value.trim(),
      cpu_cores: parseInt(cpu.value, 10) || 0,
      ram_mb: parseInt(ram.value, 10) || 0,
      price: parseInt(price.value, 10) || 0,
      currency: currency.value,
      period_months: parseInt(period.value, 10) || 0,
      next_due: due.value || '',
      notes: d.notes || '',
    };
    if (!payload.name) { tg.showAlert(t('Введите название сервера.')); return; }
    if (!(payload.period_months >= 1)) { tg.showAlert(t('Период должен быть не меньше 1 месяца.')); return; }
    try {
      await withButtonLoading(save, t('Сохранение…'), async () => {
        await api('/api/admin/server', { method: 'POST', body: JSON.stringify(payload) });
        infraDraft = null;
        showAdminServers();
      });
    } catch (e) { tg.showAlert(e.message); }
  };
  card.appendChild(save);
  if (d.id) {
    const cancel = el('button', 'secondary', t('Отмена'));
    cancel.onclick = () => { infraDraft = null; showAdminServers(); };
    card.appendChild(cancel);
  }
  return card;
}

function renderInfraFx(fx) {
  const card = el('div', 'admin-card');
  card.appendChild(el('h2', null, t('💱 Валюты и курсы')));
  card.appendChild(el('div', 'hint', t('Базовая валюта — в неё пересчитываются расходы. Курсы обновляются автоматически; вручную задайте резервный курс.')));

  const baseRow = el('div', 'admin-form-grid');
  const base = infraInput({ placeholder: t('Базовая валюта (ISO)'), value: fx.base_currency || '' });
  baseRow.appendChild(base);
  const saveBase = el('button', null, t('💾 База'));
  saveBase.onclick = () => {
    const v = (base.value || '').trim().toUpperCase();
    if (v.length !== 3) { tg.showAlert(t('Код валюты — 3 буквы, напр. USD.')); return; }
    infraPost('/api/admin/fx/base', { currency: v });
  };
  baseRow.appendChild(saveBase);
  card.appendChild(baseRow);

  const refresh = el('button', 'secondary', t('🔄 Обновить курсы'));
  refresh.onclick = () => infraPost('/api/admin/fx/refresh', {});
  card.appendChild(refresh);
  if (!fx.auto_available) {
    card.appendChild(el('div', 'hint', t('Автообновление недоступно — используйте ручные курсы.')));
  }
  if (fx.unconverted > 0) {
    card.appendChild(el('div', 'hint', t('⚠️ Серверов без курса: {n}. Задайте курс, чтобы учесть их в расходах.', { n: fx.unconverted })));
  }

  (fx.rates || []).forEach((r) => {
    const row = el('div', 'admin-list-row');
    const copy = el('div', 'admin-list-copy');
    copy.appendChild(el('div', 'admin-list-title', `1 ${r.currency} → ${fx.base_symbol || fx.base_currency}`));
    let meta = r.has_auto ? t('авто: {rate} ({date})', { rate: round2(r.auto_rate), date: r.auto_date || '—' }) : t('авто: нет');
    if (r.has_manual) meta += t(' · вручную: {rate}', { rate: round2(r.manual_rate) });
    copy.appendChild(el('div', 'admin-list-meta', meta));
    row.appendChild(copy);
    const rate = infraInput({ type: 'number', step: '0.0001', min: '0', placeholder: t('Курс') });
    rate.style.maxWidth = '110px';
    row.appendChild(rate);
    const set = el('button', 'secondary', 'OK');
    set.onclick = () => {
      const v = parseFloat(rate.value);
      if (!(v > 0)) { tg.showAlert(t('Введите положительный курс.')); return; }
      infraPost('/api/admin/fx/manual', { currency: r.currency, rate: v });
    };
    row.appendChild(set);
    card.appendChild(row);
  });
  return card;
}

// Admin sub-views: each renders the back bar plus the relevant existing
// section cards, reading from the cached adminData so language switches and
// in-place mutations re-render correctly.
async function showAdminStats() {
  currentRender = showAdminStats;
  showLoadingView('stats', t('Статистика'), title => adminPageTop(title));
  const f = adminPaymentFilters;
  const params = new URLSearchParams({
    days: String(f.days), status: f.status, provider: f.provider, kind: f.kind,
    q: f.query, page: String(f.page),
  });
  const analyticsParams = new URLSearchParams({ days: String(f.days) });
  const [statsResult, reportResult, operatorResult] = await Promise.allSettled([
    api('/api/admin/stats'),
    api('/api/admin/payments?' + params.toString()),
    api('/api/admin/analytics?' + analyticsParams.toString()),
  ]);
  if (reportResult.status === 'rejected') {
    tg.showAlert(reportResult.reason.message);
    return;
  }
  const stats = statsResult.status === 'fulfilled' ? statsResult.value : null;
  const report = reportResult.value;
  const analytics = report.analytics;
  const operatorAnalytics = operatorResult.status === 'fulfilled' ? operatorResult.value : null;

  appEl.textContent = '';
  appEl.appendChild(adminPageTop(t('Статистика')));

  const range = el('div', 'payment-range');
  [[7, t('Последние 7 дней')], [30, t('Последние 30 дней')], [90, t('Последние 90 дней')]].forEach(([days, label]) => {
    const button = el('button', days === f.days ? 'active' : '', label);
    button.onclick = () => { adminPaymentFilters.days = days; adminPaymentFilters.page = 1; showAdminStats(); };
    range.appendChild(button);
  });
  appEl.appendChild(range);
  appEl.appendChild(paymentStatsCard(t('Платежи и выручка'), [
    [t('Выручка'), analytics.total_revenue_label],
    [t('в т.ч. подписки'), analytics.revenue_label],
    [t('в т.ч. подарки'), analytics.gift_revenue_label],
    [t('в т.ч. приглашения'), analytics.invite_revenue_label],
    [t('Подтверждено'), analytics.confirmed],
    [t('Отклонено'), analytics.rejected],
    [t('Ожидают подтверждения'), analytics.pending],
    [t('Конверсия'), `${analytics.conversion_rate}%`],
  ]));
  appEl.appendChild(renderOperatorAnalytics(operatorAnalytics));
  if (stats && stats.infra_servers !== undefined) {
    appEl.appendChild(paymentStatsCard(t('Инфраструктура'), [
      [t('Серверов'), stats.infra_servers],
      [t('Расходы в месяц'), stats.infra_monthly_cost_label],
    ]));
  }
  appEl.appendChild(renderPaymentChart(analytics, report.days));
  appEl.appendChild(renderPaymentProviders(analytics.providers || []));
  appEl.appendChild(renderPaymentHistory(report));

  if (stats) {
    const userTile = (label, value, cohort) =>
      [label, value, () => showUserAdmin({ cohort, title: label, onBack: showAdminStats })];
    appEl.appendChild(paymentStatsCard(t('Пользователи панели'), [
      userTile(t('Всего'), stats.users_total, 'total'),
      userTile(t('Активные'), stats.users_active, 'active'),
      userTile(t('Истекают в ближайшие 7 дней'), stats.users_expiring_soon, 'expiring_soon'),
      userTile(t('Истекшие'), stats.users_expired, 'expired'),
      userTile(t('С привязанным Telegram'), stats.users_linked, 'linked'),
    ]));
    appEl.appendChild(paymentStatsCard(t('Подарочные коды'), [
      [t('Ожидают оплаты'), stats.gifts_pending, () => showAdminGiftRequests(showAdminStats)],
      [t('Выданы'), stats.gifts_issued, () => showAdminGiftCodes(showAdminStats)],
      [t('Активированы'), stats.gifts_activated, () => showAdminGiftCodes(showAdminStats)],
    ]));
    appEl.appendChild(paymentStatsCard(t('👥 Приглашения'), [
      [t('Ожидают одобрения'), stats.invites_pending, () => showAdminInviteRequests(showAdminStats)],
    ]));
  } else {
    const warning = el('div', 'admin-card admin-empty', t('Статистика пользователей временно недоступна.'));
    appEl.appendChild(warning);
  }
  statusEl.hidden = true;
  appEl.hidden = false;
}

  // this button opens the checker's own roomy web dashboard.
  if (health.dashboard_url) {
    const open = el('button', null, t('🌐 Открыть полную панель'));
    open.onclick = () => tg.openLink(health.dashboard_url);
    const card = el('div', 'admin-card');
    card.appendChild(open);
    appEl.appendChild(card);
  }

  if (!health.configured) {
    appEl.appendChild(el('div', 'admin-card admin-empty', t('Мониторинг прокси не настроен.')));
    statusEl.hidden = true;
    appEl.hidden = false;
    return;
  }

  appEl.appendChild(paymentStatsCard(t('Прокси'), [
    [t('Доступно'), health.up],
    [t('Недоступно'), health.down],
  ]));

  const proxies = health.proxies || [];
  if (!proxies.length) {
    appEl.appendChild(el('div', 'admin-card admin-empty', t('Прокси не найдены.')));
  } else {
    const card = el('div', 'admin-card');
    card.appendChild(el('h2', null, t('Узлы')));
    card.appendChild(el('div', 'hint', t('Выключите переключатель, чтобы не получать уведомления о доступности сервера.')));
    proxies.forEach((p) => {
      const item = el('div', 'toggle-item');
      const txt = el('div', 'ti-text');
      txt.appendChild(el('div', 'ti-label', p.name || p.address || t('прокси')));
      txt.appendChild(el('div', 'ti-desc', p.up ? `✅ ${p.latency_ms} ${t('мс')}` : `❌ ${t('нет связи')}`));
      item.appendChild(txt);
      const muted = !!p.notifications_muted;
      const sw = el('button', 'switch' + (muted ? '' : ' on')); // on = notifications enabled
      sw.appendChild(el('span', 'knob'));
      sw.onclick = () => setProxyNotif(p, !muted);
      item.appendChild(sw);
      card.appendChild(item);
    });
    appEl.appendChild(card);
  }

  statusEl.hidden = true;
  appEl.hidden = false;
}

// setProxyNotif mutes/unmutes one server's up/down alerts (globally, for all
// admins), then re-renders the proxy-health view in place.
async function setProxyNotif(p, muted) {
  try {
    await api('/api/admin/proxy-notification', { method: 'POST',
      body: JSON.stringify({ name: p.name, address: p.address, sub_name: p.sub_name, muted }) });
    showAdminProxyHealth();
  } catch (e) { tg.showAlert(e.message); }
}

function paymentStatsCard(title, rows) {

function renderPaymentChart(analytics, days) {
  const section = el('section', 'admin-section');
  section.appendChild(el('div', 'admin-section-label', t('Динамика выручки')));
  const chart = el('div', 'payment-chart');
  const daily = analytics.daily || [];
  if (!daily.length) {
    chart.appendChild(el('div', 'admin-empty', t('Нет подтверждённых платежей за период.')));
    section.appendChild(chart);
    return section;
  }
  const byDate = new Map(daily.map(d => [d.date, d]));
  const points = [];
  const today = new Date();
  for (let offset = days - 1; offset >= 0; offset--) {
    const date = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() - offset));
    const key = date.toISOString().slice(0, 10);
    points.push(byDate.get(key) || { date: key, confirmed: 0, revenue: 0, revenue_label: '0' });
  }
  const max = Math.max(...points.map(d => d.revenue), 1);
  const bars = el('div', 'payment-chart-bars');
  points.forEach(d => {
    const column = el('div', 'payment-chart-column');
    const bar = el('div', 'payment-chart-bar');
    bar.style.height = `${Math.max(2, Math.round(d.revenue / max * 100))}%`;
    bar.title = `${d.date}: ${d.confirmed} · ${d.revenue_label}`;
    column.appendChild(bar);
    bars.appendChild(column);
  });
  chart.appendChild(bars);
  const confirmed = points.reduce((sum, d) => sum + d.confirmed, 0);
  const legend = el('div', 'payment-chart-legend');
  legend.appendChild(el('span', null, points[0].date.slice(5)));
  legend.appendChild(el('span', null, t('По дням: {count} платежей на {revenue}', { count: confirmed, revenue: analytics.revenue_label })));
  legend.appendChild(el('span', null, points[points.length - 1].date.slice(5)));
  chart.appendChild(legend);
  section.appendChild(chart);
  return section;
}

}

function renderOperatorProviderMix(providers) {
  const section = el('section', 'admin-section');
  section.appendChild(el('div', 'admin-section-label', t('Микс провайдеров')));
  const list = el('div', 'payment-provider-list');
  providers.forEach(p => {
    const row = el('div', 'payment-provider');
    row.appendChild(el('div', 'payment-provider-name', paymentProviderLabel(p.provider)));
    row.appendChild(el('div', 'payment-provider-revenue', p.revenue_label || '0'));
    row.appendChild(el('div', 'payment-provider-meta',
      `${t('подтверждено {confirmed} · отклонено {rejected} · ожидает {pending}', p)} · ${t('{share}% выручки', { share: compactMetric(p.share) })}`));

function compactMetric(value) {
  const n = Number(value || 0);
  if (!Number.isFinite(n)) return '0';
  return n.toFixed(1).replace(/\.0$/, '');
}

function percentMetric(value) {
  return `${compactMetric(value)}%`;
}

function renderPaymentHistory(report) {
  const section = el('section', 'admin-section');
  section.appendChild(el('div', 'admin-section-label', `${t('История платежей')} · ${report.total}`));
  const filters = el('div', 'payment-filters');
  const searchRow = el('div', 'payment-search');
  const search = Object.assign(el('input'), { value: adminPaymentFilters.query, placeholder: t('Поиск по пользователю, Telegram ID или транзакции') });
  const applySearch = () => {
    adminPaymentFilters.query = search.value.trim();
    adminPaymentFilters.page = 1;
    showAdminStats();
  };
  search.onkeydown = e => { if (e.key === 'Enter') applySearch(); };
  searchRow.appendChild(search);
  const searchButton = el('button', null, t('Найти'));
  searchButton.onclick = applySearch;
  searchRow.appendChild(searchButton);
  filters.appendChild(searchRow);
  const status = el('select');
  [['all', t('Все статусы')], ['pending', t('Ожидает')], ['confirmed', t('Подтверждено')], ['rejected', t('Отклонено')]].forEach(([value, label]) => {
    const option = Object.assign(el('option', null, label), { value, selected: value === adminPaymentFilters.status });
    status.appendChild(option);
  });
  status.onchange = () => { adminPaymentFilters.status = status.value; adminPaymentFilters.page = 1; showAdminStats(); };
  filters.appendChild(status);
  const provider = el('select');
  [['all', t('Все способы')], ['p2p', paymentProviderLabel('p2p')], ['platega', paymentProviderLabel('platega')], ['telegram_stars', paymentProviderLabel('telegram_stars')]].forEach(([value, label]) => {
    const option = Object.assign(el('option', null, label), { value, selected: value === adminPaymentFilters.provider });
    provider.appendChild(option);
  });
  provider.onchange = () => { adminPaymentFilters.provider = provider.value; adminPaymentFilters.page = 1; showAdminStats(); };
  filters.appendChild(provider);
  const kind = el('select');
  [['all', t('Все типы')], ['payment', t('Платежи')], ['gift', t('Подарки')], ['invite', t('Приглашения')]].forEach(([value, label]) => {
    const option = Object.assign(el('option', null, label), { value, selected: value === adminPaymentFilters.kind });
    kind.appendChild(option);
  });
  kind.onchange = () => { adminPaymentFilters.kind = kind.value; adminPaymentFilters.page = 1; showAdminStats(); };
  filters.appendChild(kind);
  section.appendChild(filters);

  const history = el('div', 'payment-history');
  if (!(report.items || []).length) {
    history.appendChild(el('div', 'admin-card admin-empty', t('Платежи не найдены.')));
  }
  (report.items || []).forEach(payment => history.appendChild(renderPaymentRecord(payment)));
  section.appendChild(history);
  if (report.total_pages > 1) {
    const pages = el('div', 'payment-pages');
    const previous = el('button', 'secondary', t('Назад'));
    previous.disabled = report.page <= 1;
    previous.onclick = () => { adminPaymentFilters.page--; showAdminStats(); };
    pages.appendChild(previous);
    pages.appendChild(el('span', null, t('Страница {page} из {total}', { page: report.page, total: report.total_pages })));
    const next = el('button', 'secondary', t('Далее'));
    next.disabled = report.page >= report.total_pages;
    next.onclick = () => { adminPaymentFilters.page++; showAdminStats(); };
    pages.appendChild(next);
    section.appendChild(pages);
  }
  return section;
}

function renderPaymentRecord(payment) {
  const kind = payment.kind || 'payment';
  const nameWithTG = (name, tgID) => {
    if (name && tgID) return `${name} · TG ${tgID}`;
    if (name) return name;
    if (tgID) return `TG ${tgID}`;
    return '';
  };
  const card = el('article', 'payment-record');
  const head = el('div', 'payment-record-head');
  const title = el('div');
  title.appendChild(el('div', 'payment-record-title', `#${payment.id} · ${payment.username || nameWithTG('', payment.telegram_id) || '—'}`));
  title.appendChild(el('div', 'payment-record-price', `${payment.price_label} · ${payment.months} ${paymentMonthLabel(payment.months)}`));
  head.appendChild(title);
  const badges = el('div', 'payment-badges');
  badges.appendChild(el('span', `payment-badge kind-${kind}`, paymentKindLabel(kind)));
  if (kind === 'payment') badges.appendChild(el('span', 'payment-badge', paymentProviderLabel(payment.provider)));
  badges.appendChild(el('span', `payment-badge ${payment.status}`, paymentStatusLabel(payment.status)));
  head.appendChild(badges);
  card.appendChild(head);
  const meta = el('div', 'payment-record-meta');
  if (kind === 'gift') {
    meta.appendChild(el('div', null, `${t('Покупатель')}: ${nameWithTG(payment.username, payment.telegram_id) || '—'}`));
    const redeemer = nameWithTG(payment.payer_username, payment.payer_telegram_id);
    if (redeemer) meta.appendChild(el('div', null, `${t('Активировал')}: ${redeemer}`));
  } else if (kind === 'invite') {
    meta.appendChild(el('div', null, `${t('Пригласил')}: ${nameWithTG(payment.username, payment.telegram_id) || '—'}`));
    if (payment.payer_username) meta.appendChild(el('div', null, `${t('Новый пользователь')}: ${payment.payer_username}`));
  } else {
    meta.appendChild(el('div', null, `${t('Подписка')}: ${payment.username}${payment.telegram_id ? ` · TG ${payment.telegram_id}` : ''}`));
    const payer = payment.payer_username || (payment.payer_telegram_id ? `TG ${payment.payer_telegram_id}` : payment.username);
    meta.appendChild(el('div', null, `${t('Плательщик')}: ${payer}${payment.payer_username && payment.payer_telegram_id ? ` · TG ${payment.payer_telegram_id}` : ''}`));
  }
  meta.appendChild(el('div', null, `${t('Создано')}: ${formatPaymentDate(payment.created_at)}`));
  if (payment.resolved_at) meta.appendChild(el('div', null, `${t('Решено')}: ${formatPaymentDate(payment.resolved_at)}`));
  card.appendChild(meta);
  if (payment.provider_txn_id) {
    const copyLabel = kind === 'gift' ? t('Скопировать код') : t('Скопировать ID транзакции');
    const txn = el('div', 'payment-txn');
    txn.appendChild(el('code', null, payment.provider_txn_id));
    const copy = el('button', 'secondary', copyLabel);
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(payment.provider_txn_id);
        copy.textContent = t('✅ Скопировано');
        setTimeout(() => copy.textContent = copyLabel, 1500);
      } catch { tg.showAlert(t('Не удалось скопировать, выделите ссылку вручную.')); }
    };
    txn.appendChild(copy);
    card.appendChild(txn);
  }
  const actions = el('div', 'payment-record-actions');
  const deleteEndpoint = {
    payment: '/api/admin/payment/delete',
    gift: '/api/admin/gift/delete',
    invite: '/api/admin/invite/delete',
  }[kind] || '/api/admin/payment/delete';
  const del = el('button', 'secondary payment-delete', t('Удалить из истории'));
  del.onclick = async () => {
    if (!(await confirmDialog(paymentDeleteConfirm(kind, payment.id)))) return;
    try {
      await withButtonLoading(del, t('Удаление…'), () =>
        api(deleteEndpoint, { method: 'POST', body: JSON.stringify({ id: payment.id }) }));
      showAdminStats();
    } catch (e) { tg.showAlert(e.message); }
  };
  actions.appendChild(del);
  card.appendChild(actions);
  return card;
}

function paymentKindLabel(kind) {
  if (kind === 'gift') return t('🎁 Подарок');
  if (kind === 'invite') return t('👥 Приглашение');
  return t('💳 Платёж');
}

// paymentDeleteConfirm returns a kind-specific confirmation. Deletion only
// touches local history: it never reverses an applied panel change, and for an
// unredeemed gift code it makes that code permanently unusable.
function paymentDeleteConfirm(kind, id) {
  if (kind === 'gift') return t('Удалить подарок №{id} из истории? Действие необратимо; неактивированный код станет недействительным.', { id });
  if (kind === 'invite') return t('Удалить приглашение №{id} из истории? Действие необратимо.', { id });
  return t('Удалить платёж №{id} из истории? Это действие необратимо и не отменяет уже продлённую подписку.', { id });
}

function paymentProviderLabel(provider) {
  if (provider === 'platega') return 'Platega';
  if (provider === 'telegram_stars') return t('Telegram Stars');
  return 'P2P';
}

function paymentStatusLabel(status) {
  if (status === 'confirmed') return t('Подтверждено');
  if (status === 'rejected') return t('Отклонено');
  if (status === 'issued') return t('Выдан');
  if (status === 'redeemed') return t('Активирован');
  if (status === 'revoked') return t('Отозван');
  if (status === 'approved') return t('Одобрено');
  return t('Ожидает');
}

function paymentMonthLabel(months) {
  if (LANG === 'en') return months === 1 ? t('месяц') : t('месяца');
  const mod10 = months % 10, mod100 = months % 100;
  if (mod10 === 1 && mod100 !== 11) return t('месяц');
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return t('месяца');
  return t('месяцев');
}

function formatPaymentDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString(LANG === 'en' ? 'en-GB' : 'ru-RU', {
    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}
