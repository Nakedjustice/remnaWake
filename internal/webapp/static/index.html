<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 12px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--secondary-bg);
    color: var(--text);
  }
  h1 { font-size: 20px; margin: 8px 4px 16px; }
  .card {
    background: var(--bg);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 15px; }
  .row .k { color: var(--hint); flex-shrink: 0; }
  .row .v { text-align: right; word-break: break-word; }
  .badge { font-weight: 600; }
  .sub-link {
    display: block;
    font-size: 13px;
    color: var(--link);
    word-break: break-all;
    margin: 6px 0 2px;
    text-decoration: none;
  }
  button {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    background: var(--button);
    color: var(--button-text);
    cursor: pointer;
  }
  button.secondary {
    background: var(--secondary-bg);
    color: var(--text);
  }
  button:disabled { opacity: .55; }
  .tariffs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tariffs button {
    flex: 1 1 calc(50% - 4px);
    width: auto;
    margin-top: 0;
    padding: 10px 6px;
  }
  .tariffs button.selected { outline: 3px solid var(--link); }
  .hint { color: var(--hint); font-size: 13px; margin-top: 8px; }
  pre.requisites {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 14px;
    background: var(--secondary-bg);
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0 0;
  }
  #status { text-align: center; color: var(--hint); padding: 32px 8px; font-size: 15px; }
  input, textarea, select {
    width: 100%;
    border: 1px solid var(--secondary-bg);
    border-radius: 10px;
    padding: 10px;
    margin-top: 8px;
    font-size: 15px;
    font-family: inherit;
    background: var(--secondary-bg);
    color: var(--text);
  }
  textarea { min-height: 90px; resize: vertical; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--secondary-bg);
    padding: 8px 0;
    font-size: 14px;
  }
  .item:first-of-type { border-top: 0; }
  .item .info { word-break: break-word; }
  .item .st { color: var(--hint); font-size: 13px; }
  .item button { width: auto; margin: 0; padding: 7px 12px; font-size: 13px; flex-shrink: 0; }
  .item .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .pair { display: flex; gap: 8px; }
  .gift { border-top: 1px solid var(--secondary-bg); padding: 8px 0; font-size: 14px; }
  .gift:first-of-type { border-top: 0; }
  .gift .code { font-family: ui-monospace, monospace; }
  .gift .st { color: var(--hint); font-size: 13px; }
  details { border-top: 1px solid var(--secondary-bg); }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; padding: 8px 0; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<h1>👤 Личный кабинет</h1>
<div id="status">Загрузка…</div>
<div id="app" hidden></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const statusEl = document.getElementById('status');
const appEl = document.getElementById('app');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function row(parent, k, v) {
  const r = el('div', 'row');
  r.appendChild(el('span', 'k', k));
  r.appendChild(el('span', 'v', v));
  parent.appendChild(r);
  return r;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Authorization': 'tma ' + tg.initData,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ('Ошибка ' + res.status));
  return body;
}

function daysWord(n) {
  const last = n % 100;
  if (last >= 11 && last <= 14) return 'дней';
  switch (n % 10) {
    case 1: return 'день';
    case 2: case 3: case 4: return 'дня';
    default: return 'дней';
  }
}

function renderProfile(p, data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '📡 ' + p.username));
  const st = row(card, 'Статус', p.status_label);
  st.querySelector('.v').classList.add('badge');
  if (p.expire_at) {
    let v = p.expire_at;
    if (p.days_left > 0) v += ` (осталось ${p.days_left} ${daysWord(p.days_left)})`;
    row(card, 'Действует до', v);
  }
  if (p.subscription_url) {
    const a = el('a', 'sub-link', p.subscription_url);
    a.href = p.subscription_url;
    a.target = '_blank';
    card.appendChild(a);
    const copy = el('button', 'secondary', '📋 Скопировать ссылку');
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(p.subscription_url);
        copy.textContent = '✅ Скопировано';
        setTimeout(() => copy.textContent = '📋 Скопировать ссылку', 1500);
      } catch { tg.showAlert('Не удалось скопировать, выделите ссылку вручную.'); }
    };
    card.appendChild(copy);
  }
  card.appendChild(renderRenew(p, data));
  return card;
}

function renderRenew(p, data) {
  const wrap = el('div');
  let months = 0;
  const tariffs = data.tariffs || [];
  if (tariffs.length) {
    wrap.appendChild(el('div', 'hint', 'Продление — выберите период:'));
    const grid = el('div', 'tariffs');
    tariffs.forEach(t => {
      const b = el('button', 'secondary', `${t.months} мес. — ${t.price_label}`);
      b.onclick = () => {
        months = t.months;
        grid.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        pay.disabled = false;
      };
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
  } else {
    months = 1;
  }
  const pay = el('button', null, '💳 Оплатить / продлить');
  pay.disabled = tariffs.length > 0;
  pay.onclick = async () => {
    pay.disabled = true;
    pay.textContent = 'Отправка…';
    try {
      await api('/api/renew', {
        method: 'POST',
        body: JSON.stringify({ remnawave_id: p.remnawave_id, months }),
      });
      pay.textContent = '✅ Заявка отправлена';
      tg.showAlert('Заявка отправлена администратору. После оплаты и подтверждения подписка будет продлена.');
    } catch (e) {
      pay.disabled = false;
      pay.textContent = '💳 Оплатить / продлить';
      tg.showAlert(e.message);
    }
  };
  wrap.appendChild(pay);
  return wrap;
}

// renderGiftBuy mirrors the chat /gift flow: pick a period, the request goes
// to the admins, the code and link arrive after payment confirmation.
function renderGiftBuy(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '🎁 Подарить подписку'));
  card.appendChild(el('div', 'hint',
    'Выберите период. После подтверждения оплаты администратором вы получите код и ссылку для подарка.'));
  let months = 0;
  const tariffs = (data.tariffs || []).length ? data.tariffs : [{ months: 1, price: 0 }];
  const grid = el('div', 'tariffs');
  tariffs.forEach(t => {
    const label = t.price > 0 ? `${t.months} мес. — ${t.price_label}` : `${t.months} мес.`;
    const b = el('button', 'secondary', label);
    b.onclick = () => {
      months = t.months;
      grid.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      send.disabled = false;
    };
    grid.appendChild(b);
  });
  card.appendChild(grid);
  const send = el('button', null, '🎁 Отправить заявку');
  send.disabled = true;
  send.onclick = async () => {
    if (!(await confirmDialog(`Оформить подарочную подписку на ${months} мес.?`))) return;
    send.disabled = true;
    send.textContent = 'Отправка…';
    try {
      await api('/api/gift', { method: 'POST', body: JSON.stringify({ months }) });
      tg.showAlert('Заявка отправлена администратору. После подтверждения оплаты вы получите код и ссылку.');
      await showCabinet();
    } catch (e) {
      tg.showAlert(e.message);
      send.disabled = false;
      send.textContent = '🎁 Отправить заявку';
    }
  };
  card.appendChild(send);
  return card;
}

// renderInvite mirrors the chat /invite flow: enter a username, the request
// goes to the admins for approval.
function renderInvite() {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '👥 Пригласить пользователя'));
  card.appendChild(el('div', 'hint',
    'Имя нового пользователя: буквы, цифры и «_», от 3 до 32 символов. Заявку рассмотрит администратор.'));
  const input = Object.assign(el('input'), { placeholder: 'Имя пользователя' });
  card.appendChild(input);
  const send = el('button', null, '👥 Отправить заявку');
  send.onclick = async () => {
    const name = input.value.trim();
    if (!/^[\p{L}\p{N}_]{3,32}$/u.test(name)) {
      tg.showAlert('Некорректное имя: только буквы, цифры и «_», от 3 до 32 символов.');
      return;
    }
    if (!(await confirmDialog(`Отправить заявку на пользователя «${name}»?`))) return;
    send.disabled = true;
    send.textContent = 'Отправка…';
    try {
      await api('/api/invite', { method: 'POST', body: JSON.stringify({ username: name }) });
      tg.showAlert('Заявка отправлена администратору.');
      input.value = '';
      await showCabinet();
      return;
    } catch (e) { tg.showAlert(e.message); }
    send.disabled = false;
    send.textContent = '👥 Отправить заявку';
  };
  card.appendChild(send);
  return card;
}

// giftStatuses mirrors the order and labels of the bot's /mygifts status picker.
const giftStatuses = [
  ['pending', '⏳ Ожидают оплаты'],
  ['issued', '📨 Выданные'],
  ['redeemed', '✅ Активированные'],
  ['rejected', '❌ Отклонённые'],
  ['revoked', '🚫 Отозванные'],
];

// renderMyGifts groups the user's gifts by status, like the bot's /mygifts
// menu; issued gifts expose their redemption link with a copy button.
function renderMyGifts(data) {
  const gifts = data.gifts || [];
  if (!gifts.length) return null;
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '📦 Мои подарки'));
  giftStatuses.forEach(([status, label]) => {
    const list = gifts.filter(g => g.status === status);
    if (!list.length) return;
    const det = el('details');
    det.appendChild(el('summary', null, `${label} (${list.length})`));
    list.forEach(g => {
      const d = el('div', 'gift');
      d.appendChild(el('div', 'code', `${g.code} — ${g.months} мес. (${g.created_at})`));
      d.appendChild(el('div', 'st', g.status_label));
      if (g.link) {
        const a = el('a', 'sub-link', g.link);
        a.href = g.link;
        a.target = '_blank';
        d.appendChild(a);
        const copy = el('button', 'secondary', '📋 Скопировать ссылку');
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(g.link);
            copy.textContent = '✅ Скопировано';
            setTimeout(() => copy.textContent = '📋 Скопировать ссылку', 1500);
          } catch { tg.showAlert('Не удалось скопировать, выделите ссылку вручную.'); }
        };
        d.appendChild(copy);
      }
      det.appendChild(d);
    });
    card.appendChild(det);
  });
  return card;
}

function renderUnlinked() {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, 'Аккаунт не привязан'));
  card.appendChild(el('div', 'hint',
    'Ваш Telegram пока не привязан к профилю подписки. Привяжите аккаунт в чате с ботом командой /register — и здесь появятся статус, дата окончания и ссылка.'));
  const b = el('button', null, '🔗 Привязать в чате');
  b.onclick = () => tg.close();
  card.appendChild(b);
  return card;
}

function render(data) {
  appEl.textContent = '';

  if (data.is_admin) {
    const card = el('div', 'card');
    card.appendChild(el('h2', null, '⚙️ Администрирование'));
    card.appendChild(el('div', 'hint', 'Тарифы, реквизиты, подарочные коды и заявки на оплату.'));
    const open = el('button', null, '⚙️ Открыть админ-панель');
    open.onclick = showAdmin;
    card.appendChild(open);
    appEl.appendChild(card);
  }

  if (!data.linked) {
    appEl.appendChild(renderUnlinked());
  } else {
    (data.profiles || []).forEach(p => appEl.appendChild(renderProfile(p, data)));
  }

  if (data.requisites) {
    const card = el('div', 'card');
    card.appendChild(el('h2', null, '💳 Реквизиты для оплаты'));
    card.appendChild(Object.assign(el('pre', 'requisites'), { textContent: data.requisites }));
    appEl.appendChild(card);
  }

  if (data.linked) {
    appEl.appendChild(renderGiftBuy(data));
    appEl.appendChild(renderInvite());
  }

  const myGifts = renderMyGifts(data);
  if (myGifts) appEl.appendChild(myGifts);

  if (data.invites) {
    const card = el('div', 'card');
    card.appendChild(el('h2', null, '👥 Приглашения'));
    let v = String(data.invites.total);
    if (data.invites.pending > 0) v += ` (${data.invites.pending} на рассмотрении)`;
    row(card, 'Всего', v);
    appEl.appendChild(card);
  }

  const actions = el('div', 'card');
  actions.appendChild(el('h2', null, 'Действия в чате'));
  actions.appendChild(el('div', 'hint', 'Привязка профиля и активация подарочных кодов оформляются в диалоге с ботом.'));
  const back = el('button', 'secondary', '💬 Вернуться в чат');
  back.onclick = () => tg.close();
  actions.appendChild(back);
  appEl.appendChild(actions);

  statusEl.hidden = true;
  appEl.hidden = false;
}

// --- Admin panel (the server re-checks admin rights on every /api/admin call) ---

function confirmDialog(message) {
  return new Promise(resolve => {
    if (tg.showConfirm) tg.showConfirm(message, ok => resolve(ok));
    else resolve(window.confirm(message));
  });
}

async function showCabinet() {
  try {
    render(await api('/api/me'));
  } catch (e) { tg.showAlert(e.message); }
}

async function showAdmin() {
  try {
    renderAdmin(await api('/api/admin'));
  } catch (e) { tg.showAlert(e.message); }
}

// adminAction posts a mutation (optionally after a confirm dialog) and
// re-renders the panel from fresh data.
async function adminAction(path, payload, message) {
  if (message && !(await confirmDialog(message))) return;
  try {
    await api(path, { method: 'POST', body: JSON.stringify(payload) });
    await showAdmin();
  } catch (e) { tg.showAlert(e.message); }
}

function renderAdminTariffs(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '📋 Тарифы'));
  if ((data.tariffs || []).length) {
    data.tariffs.forEach(t => {
      const item = el('div', 'item');
      item.appendChild(el('div', 'info', `${t.months} мес. — ${t.price_label}`));
      const del = el('button', 'secondary', '🗑 Удалить');
      del.onclick = () => adminAction('/api/admin/tariff/delete', { months: t.months },
        `Удалить тариф на ${t.months} мес.?`);
      item.appendChild(del);
      card.appendChild(item);
    });
  } else {
    card.appendChild(el('div', 'hint', 'Тарифы не заданы.'));
  }
  card.appendChild(el('div', 'hint', 'Добавить или обновить тариф:'));
  const pair = el('div', 'pair');
  const months = Object.assign(el('input'), { type: 'number', min: '1', placeholder: 'Месяцев' });
  const price = Object.assign(el('input'), { type: 'number', min: '1', placeholder: 'Цена' });
  pair.appendChild(months);
  pair.appendChild(price);
  card.appendChild(pair);
  const save = el('button', null, '💾 Сохранить тариф');
  save.onclick = () => {
    const m = parseInt(months.value, 10), p = parseInt(price.value, 10);
    if (!(m >= 1) || !(p >= 1)) { tg.showAlert('Введите количество месяцев и цену (целые ≥ 1).'); return; }
    adminAction('/api/admin/tariff', { months: m, price: p });
  };
  card.appendChild(save);
  return card;
}

function renderAdminRequisites(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '💳 Реквизиты'));
  const text = Object.assign(el('textarea'), { value: data.requisites || '', placeholder: 'Текст реквизитов' });
  card.appendChild(text);
  const save = el('button', null, '💾 Сохранить реквизиты');
  save.onclick = () => {
    if (!text.value.trim()) { tg.showAlert('Текст реквизитов не может быть пустым.'); return; }
    adminAction('/api/admin/requisites', { text: text.value });
  };
  card.appendChild(save);
  return card;
}

function renderAdminBroadcast() {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '📢 Рассылка'));
  card.appendChild(el('div', 'hint', 'Сообщение получат все пользователи с привязанным Telegram.'));
  const text = Object.assign(el('textarea'), { placeholder: 'Текст сообщения' });
  card.appendChild(text);
  const send = el('button', null, '📢 Отправить всем');
  send.onclick = async () => {
    if (!text.value.trim()) { tg.showAlert('Текст рассылки не может быть пустым.'); return; }
    if (!(await confirmDialog('Отправить сообщение всем пользователям?'))) return;
    send.disabled = true;
    send.textContent = 'Отправка…';
    try {
      const res = await api('/api/admin/broadcast', {
        method: 'POST',
        body: JSON.stringify({ message: text.value }),
      });
      text.value = '';
      tg.showAlert(`Рассылка завершена: отправлено ${res.sent}, ошибок ${res.failed}.`);
    } catch (e) { tg.showAlert(e.message); }
    send.disabled = false;
    send.textContent = '📢 Отправить всем';
  };
  card.appendChild(send);
  return card;
}

function renderAdminGifts(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '🎁 Активные подарочные коды'));
  if (!(data.gifts || []).length) {
    card.appendChild(el('div', 'hint', 'Активных подарочных кодов нет.'));
    return card;
  }
  data.gifts.forEach(g => {
    const item = el('div', 'item');
    const info = el('div', 'info');
    info.appendChild(el('div', 'code', `${g.code} — ${g.months} мес.`));
    info.appendChild(el('div', 'st', `от ${g.buyer} (${g.created_at})`));
    item.appendChild(info);
    const revoke = el('button', 'secondary', '🚫 Отозвать');
    revoke.onclick = () => adminAction('/api/admin/gift/revoke', { id: g.id },
      `Отозвать код ${g.code}?`);
    item.appendChild(revoke);
    card.appendChild(item);
  });
  return card;
}

function renderAdminRequests(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '💰 Заявки на оплату'));
  if (!(data.requests || []).length) {
    card.appendChild(el('div', 'hint', 'Ожидающих заявок нет.'));
    return card;
  }
  data.requests.forEach(r => {
    const item = el('div', 'item');
    const info = el('div', 'info');
    let line = `${r.username} — ${r.months} мес.`;
    if (r.price_label) line += ` (${r.price_label})`;
    info.appendChild(el('div', null, line));
    let st = `заявка от ${r.created_at}`;
    if (r.expire_at) st += `, подписка до ${r.expire_at}`;
    info.appendChild(el('div', 'st', st));
    item.appendChild(info);
    const btns = el('div', 'btns');
    const ok = el('button', null, '✅');
    ok.onclick = () => adminAction('/api/admin/request/confirm', { id: r.id },
      `Подтвердить оплату «${r.username}» на ${r.months} мес.?`);
    const rej = el('button', 'secondary', '❌');
    rej.onclick = () => adminAction('/api/admin/request/reject', { id: r.id },
      `Отклонить заявку «${r.username}»?`);
    btns.appendChild(ok);
    btns.appendChild(rej);
    item.appendChild(btns);
    card.appendChild(item);
  });
  return card;
}

function renderAdminGiftRequests(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '🎁 Заявки на подарки'));
  if (!(data.gift_requests || []).length) {
    card.appendChild(el('div', 'hint', 'Ожидающих заявок нет.'));
    return card;
  }
  data.gift_requests.forEach(r => {
    const item = el('div', 'item');
    const info = el('div', 'info');
    let line = `${r.buyer} — ${r.months} мес.`;
    if (r.price_label) line += ` (${r.price_label})`;
    info.appendChild(el('div', null, line));
    info.appendChild(el('div', 'st', `код ${r.code}, заявка от ${r.created_at}`));
    item.appendChild(info);
    const btns = el('div', 'btns');
    const ok = el('button', null, '✅');
    ok.onclick = () => adminAction('/api/admin/gift-request/confirm', { id: r.id },
      `Подтвердить оплату подарка от «${r.buyer}» на ${r.months} мес.?`);
    const rej = el('button', 'secondary', '❌');
    rej.onclick = () => adminAction('/api/admin/gift-request/reject', { id: r.id },
      `Отклонить заявку на подарок от «${r.buyer}»?`);
    btns.appendChild(ok);
    btns.appendChild(rej);
    item.appendChild(btns);
    card.appendChild(item);
  });
  return card;
}

function renderAdminInviteRequests(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '👤 Заявки на приглашения'));
  if (!(data.invite_requests || []).length) {
    card.appendChild(el('div', 'hint', 'Ожидающих заявок нет.'));
    return card;
  }
  data.invite_requests.forEach(r => {
    const item = el('div', 'item');
    const info = el('div', 'info');
    let line = `${r.new_username} — ${r.months} мес.`;
    if (r.price_label) line += ` (${r.price_label})`;
    info.appendChild(el('div', null, line));
    info.appendChild(el('div', 'st', `от ${r.inviter}, заявка от ${r.created_at}`));
    item.appendChild(info);
    const btns = el('div', 'btns');
    const ok = el('button', null, '✅');
    ok.onclick = () => adminAction('/api/admin/invite-request/confirm', { id: r.id },
      `Создать пользователя «${r.new_username}» по заявке от «${r.inviter}»?`);
    const rej = el('button', 'secondary', '❌');
    rej.onclick = () => adminAction('/api/admin/invite-request/reject', { id: r.id },
      `Отклонить заявку на пользователя «${r.new_username}»?`);
    btns.appendChild(ok);
    btns.appendChild(rej);
    item.appendChild(btns);
    card.appendChild(item);
  });
  return card;
}

function renderAdminSquad(data) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '🛡 Сквад по умолчанию'));
  card.appendChild(el('div', 'hint', data.default_squad_name
    ? `Новые пользователи добавляются в сквад «${data.default_squad_name}».`
    : 'Сквад не выбран: используется сквад «Default-Squad», если он есть в панели.'));
  const select = el('select');
  select.appendChild(Object.assign(el('option', null, 'Загрузка…'), { value: '' }));
  select.disabled = true;
  card.appendChild(select);
  const save = el('button', null, '💾 Сохранить сквад');
  save.disabled = true;
  save.onclick = () => {
    if (!select.value) { tg.showAlert('Выберите сквад.'); return; }
    adminAction('/api/admin/squad', { uuid: select.value });
  };
  card.appendChild(save);
  api('/api/admin/squads').then(res => {
    select.textContent = '';
    const squads = res.squads || [];
    if (!squads.length) {
      select.appendChild(Object.assign(el('option', null, 'В панели нет сквадов'), { value: '' }));
      return;
    }
    squads.forEach(sq => {
      const opt = Object.assign(el('option', null, sq.name), { value: sq.uuid });
      if (sq.selected) opt.selected = true;
      select.appendChild(opt);
    });
    if (!squads.some(sq => sq.selected)) {
      select.insertBefore(Object.assign(el('option', null, '— не выбран —'),
        { value: '', selected: true }), select.firstChild);
    }
    select.disabled = false;
    save.disabled = false;
  }).catch(e => {
    select.textContent = '';
    select.appendChild(Object.assign(el('option', null, 'Ошибка загрузки сквадов'), { value: '' }));
    tg.showAlert(e.message);
  });
  return card;
}

function renderAdmin(data) {
  appEl.textContent = '';

  const top = el('div', 'card');
  top.appendChild(el('h2', null, '⚙️ Админ-панель'));
  const back = el('button', 'secondary', '← Назад в кабинет');
  back.onclick = showCabinet;
  top.appendChild(back);
  appEl.appendChild(top);

  appEl.appendChild(renderAdminRequests(data));
  appEl.appendChild(renderAdminGiftRequests(data));
  appEl.appendChild(renderAdminInviteRequests(data));
  appEl.appendChild(renderAdminTariffs(data));
  appEl.appendChild(renderAdminRequisites(data));
  appEl.appendChild(renderAdminSquad(data));
  appEl.appendChild(renderAdminGifts(data));
  appEl.appendChild(renderAdminBroadcast());

  statusEl.hidden = true;
  appEl.hidden = false;
}

(async () => {
  if (!tg.initData) {
    statusEl.textContent = 'Откройте это приложение из Telegram.';
    return;
  }
  try {
    render(await api('/api/me'));
  } catch (e) {
    statusEl.textContent = '⚠️ ' + e.message;
  }
})();
</script>
</body>
</html>
