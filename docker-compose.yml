services:
  bot:
    # Pre-built image published to GHCR. `docker compose up -d` pulls it —
    # no local build needed. To build from local source instead (development),
    # add the override file:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/nakedjustice/remnawake:main
    pull_policy: always
    container_name: remnaWake-bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_PATH: /data/bot.db
    volumes:
      - botdata:/data
    # Scope label so a scoped Watchtower (see below) updates only this container.
    # Harmless when auto-update is off.
    labels:
      com.centurylinklabs.watchtower.scope: "remnawake"
    # Telegram Mini App: set WEBAPP_URL in .env and expose the embedded web
    # server (container port 8080) to your HTTPS reverse proxy.
    #
    # Host-level proxy (nginx / standalone Caddy on the host): install.sh writes
    # docker-compose.override.yml with a 127.0.0.1:${WEBAPP_HOST_PORT}:8080
    # mapping. Manual equivalent:
    # ports:
    #   - "127.0.0.1:8080:8080"
    #
    # Containerised Caddy alongside remnawave: do NOT publish the port — inside
    # the Caddy container 127.0.0.1 is Caddy itself. Instead join remnawave's
    # network (below) and proxy to the container name: `reverse_proxy
    # remnaWake-bot:8080`. See "Running alongside remnawave" in the README.
    # networks:
    #   - remnawave-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # One-tap auto-update: install.sh can write docker-compose.override.yml with
    # the Watchtower service below, put the bot and watchtower on a shared
    # network, and set in .env:
    #   AUTOUPDATE_ENABLED=true
    #   WATCHTOWER_URL=http://watchtower:8080
    #   WATCHTOWER_TOKEN=<the same token as below>
    # networks:
    #   - autoupdate

  # Watchtower in HTTP-API trigger-only mode: it does NOT poll on a schedule;
  # it only pulls the new image and recreates remnaWake-bot when the bot calls
  # its /v1/update endpoint (after an admin taps "Install now"). Watchtower —
  # not the bot — holds the docker socket, so the bot stays unprivileged.
  # The maintained fork of Watchtower — the original containrrr image was
  # archived in December 2025 and does not work against current Docker daemons.
  # watchtower:
  #   image: nickfedor/watchtower:latest
  #   pull_policy: always
  #   container_name: remnaWake-watchtower
  #   restart: unless-stopped
  #   environment:
  #     # DOCKER_API_VERSION is deliberately unset: Watchtower then negotiates
  #     # the API version with the host daemon instead of being pinned to one.
  #     WATCHTOWER_HTTP_API_UPDATE: "true"
  #     WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_TOKEN}"
  #     # Only touch this project's container, not every container on the host:
  #     WATCHTOWER_SCOPE: "remnawake"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - autoupdate

  # Optional Xray Checker proxy monitoring: install.sh can write this service to
  # docker-compose.override.yml when enabled. It probes connectivity through each
  # proxy in XRAY_CHECKER_SUB_URL and exposes /metrics on port 2112; the bot polls
  # it (XRAY_CHECKER_URL=http://xray-checker:2112) to show proxy health to admins
  # and DM them on down/recovery. Both containers share this compose project's
  # default network, so no published port is needed for the bot to reach it.
  # xray-checker:
  #   image: kutovoys/xray-checker:latest
  #   pull_policy: always
  #   container_name: remnaWake-xray-checker
  #   restart: unless-stopped
  #   environment:
  #     SUBSCRIPTION_URL: "${XRAY_CHECKER_SUB_URL}"
  #     PROXY_CHECK_METHOD: "${XRAY_CHECKER_METHOD}"
  #     METRICS_PROTECTED: "true"
  #     METRICS_USERNAME: "${XRAY_CHECKER_USERNAME}"
  #     METRICS_PASSWORD: "${XRAY_CHECKER_PASSWORD}"
  #     METRICS_PORT: "2112"
  # To expose the checker's own web dashboard (XRAY_CHECKER_PUBLIC_URL) on the
  # same domain as the Mini App, serve it under a sub-path: set METRICS_BASE_PATH
  # and reverse-proxy that prefix to xray-checker:2112. The base path applies to
  # /metrics too, so XRAY_CHECKER_URL must include it (http://xray-checker:2112/checker).
  #     METRICS_BASE_PATH: "${XRAY_CHECKER_BASE_PATH}"
  # A host-level reverse proxy instead needs a published loopback port:
  #   ports:
  #     - "127.0.0.1:2112:2112"

# Uncomment alongside the watchtower service above to let the bot reach it by
# name on an isolated internal network.
# networks:
#   autoupdate:
#     driver: bridge

# Uncomment to attach the bot to remnawave's existing network (used by the
# containerised-Caddy setup above so Caddy can reach `remnaWake-bot:8080`).
# networks:
#   remnawave-network:
#     name: remnawave-network
#     external: true

volumes:
  botdata:
