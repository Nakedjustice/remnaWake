services:
  bot:
    # Pre-built image published to GHCR. `docker compose up -d` pulls it —
    # no local build needed. To build from local source instead (development),
    # add the override file:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/nakedjustice/remnawake:main
    pull_policy: always
    container_name: remnaWake-bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_PATH: /data/bot.db
    volumes:
      - botdata:/data
    # Telegram Mini App: set WEBAPP_URL in .env and expose the embedded web
    # server to your HTTPS reverse proxy.
    # ports:
    #   - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  botdata:
